name: nix

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Format
        run: nix fmt -- --fail-on-change .
      - name: Lint
        run: |
          nix run nixpkgs#statix -- check .
          nix run nixpkgs#deadnix -- --fail --exclude "**/hardware-configuration.nix" .
      - name: Shell scripts
        run: |
          nix run nixpkgs#shellcheck -- install.sh dotfiles/scripts/.local/share/scripts/*.sh
      - name: Evaluate both systems
        run: |
          nix eval .#nixosConfigurations.nixbox-mango.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.nixbox-plasma.config.system.build.toplevel.drvPath
      - name: Build both systems
        run: |
          nix build --no-link .#nixosConfigurations.nixbox-mango.config.system.build.toplevel
          nix build --no-link .#nixosConfigurations.nixbox-plasma.config.system.build.toplevel
      - name: Install guide compiles
        run: nix run nixpkgs#typst -- compile docs/nixos-install-guide.typ --root . /tmp/guide.pdf
